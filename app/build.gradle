
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minax333.signage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.minax333.signage'
        minSdk 17
        targetSdk 17

        versionCode 1
        versionName '0.0.1'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
            def keyAliasValue = System.getenv('SIGNING_KEY_ALIAS')
            def keyPasswordValue = System.getenv('SIGNING_KEY_PASSWORD')
            def storePasswordValue = System.getenv('SIGNING_STORE_PASSWORD')

            if (keystorePath && keyAliasValue &&
                    keyPasswordValue && storePasswordValue) {
                storeFile file(keystorePath)
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                storePassword storePasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            def keystorePath = System.getenv('SIGNING_KEYSTORE_PATH')
            def keyAliasValue = System.getenv('SIGNING_KEY_ALIAS')
            def keyPasswordValue = System.getenv('SIGNING_KEY_PASSWORD')
            def storePasswordValue = System.getenv('SIGNING_STORE_PASSWORD')

            if (keystorePath && keyAliasValue &&
                    keyPasswordValue && storePasswordValue) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
