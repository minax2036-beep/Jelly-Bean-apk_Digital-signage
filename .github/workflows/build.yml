name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        run: |
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"

          echo "=== ANDROID_SDK_ROOT ==="
          echo "$ANDROID_SDK_ROOT"

          echo "=== SDK directories ==="
          ls -la /usr/local/lib/android/sdk/ || true

          echo "=== Search sdkmanager ==="
          find /usr/local/lib/android/sdk -type f -name sdkmanager -print 2>/dev/null || true

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found anywhere in Android SDK"
            echo "Searching entire runner..."
            find /usr/local/lib/android -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"
          
          "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platforms;android-17" "build-tools;25.0.3"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Signage-debug
          path: app/build/outputs/apk/debug/app-debug.apk
