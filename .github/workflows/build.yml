name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 新しい Android SDK Command-line Tools は JDK 17 以上が必要
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK の場所を PATH に追加
      - name: Set Android SDK path
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      # Android 4.2.2 用 SDK をインストール
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-17" "build-tools;25.0.3"

      # 古い Android Gradle Plugin / Gradle 用に Java 8へ戻す
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Gradle 2.14.1 をインストール
      - name: Install Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      # APKをビルド
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon

      # APKをActionsの成果物として保存
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Signage-debug
          path: app/build/outputs/apk/debug/app-debug.apk
